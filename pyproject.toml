[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paciente-virtual"
version = "0.1.0"
description = "Prototipo educativo de integración fisiológica por agentes"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["pruebas"]

